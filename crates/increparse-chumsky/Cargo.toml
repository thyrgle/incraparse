[package]
name = "increparse-chumsky"
version = "0.1.0"
edition = "2021"
description = "chumsky adapter for increparse: wrap chumsky parsers in passes with correct absolute-span rebasing."
license = "MIT OR Apache-2.0"
keywords = ["parser", "chumsky", "combinators", "lsp"]
categories = ["parsing"]

[dependencies]
increparse = { path = "../increparse", version = "0.1.0" }
chumsky = "0.10"
