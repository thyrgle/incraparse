[package]
name = "increparse-nom"
version = "0.1.0"
edition = "2021"
description = "nom adapter for increparse: wrap nom parsers in passes with correct absolute-span rebasing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thyrgle/increparse"
readme = "../../README.md"
keywords = ["parser", "nom", "combinators", "lsp"]
categories = ["parsing"]

[dependencies]
increparse = { path = "../increparse", version = "0.1.0" }
nom = "8.0"
nom_locate = "5.0"
