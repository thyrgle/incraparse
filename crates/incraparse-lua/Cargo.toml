[package]
name = "incraparse-lua"
version = "0.1.0"
edition = "2021"
description = "Define an incraparse language server in pure Lua: passes, diagnostics, and symbols in one Lua file."
license = "MIT OR Apache-2.0"
keywords = ["parser", "lua", "lsp", "neovim"]
categories = ["parsing"]

[dependencies]
incraparse = { path = "../incraparse", version = "0.1.0" }
incraparse-lsp = { path = "../incraparse-lsp", version = "0.1.0" }
lsp-types = "0.97"
mlua = { version = "0.12", features = ["lua54", "send", "vendored"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "incraparse_lua"

[[bin]]
name = "incraparse-lua-server"
path = "src/bin/server.rs"
