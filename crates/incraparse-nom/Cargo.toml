[package]
name = "incraparse-nom"
version = "0.1.0"
edition = "2021"
description = "nom adapter for incraparse: wrap nom parsers in passes with correct absolute-span rebasing."
license = "MIT OR Apache-2.0"
keywords = ["parser", "nom", "combinators", "lsp"]
categories = ["parsing"]

[dependencies]
incraparse = { path = "../incraparse", version = "0.1.0" }
nom = "8.0"
nom_locate = "5.0"
